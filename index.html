<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Estudos - CFO CBMPE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #13161c;
      --bg-panel: #1e232d;
      --bg-card: #161a22;
      --bg-hover: #262c3a;
      --border-color: #2e3545;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --brand: #10b981;
      --brand-hover: #059669;
    }
    body.light-mode {
      --bg-main: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: #f8fafc;
      --bg-hover: #e2e8f0;
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --brand: #059669;
      --brand-hover: #047857;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .bg-main { background-color: var(--bg-main); }
    .bg-panel { background-color: var(--bg-panel); }
    .bg-card { background-color: var(--bg-card); }
    .hover-bg:hover { background-color: var(--bg-hover); }
    .border-theme { border-color: var(--border-color); }
    .text-main { color: var(--text-primary); }
    .text-sec { color: var(--text-secondary); }
    .text-mut { color: var(--text-muted); }
    .text-brand { color: var(--brand); }
    .bg-brand { background-color: var(--brand); }
    
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .animate-glow { animation: pulse-glow 3s infinite; }

    .tree-children {
      transition: all 0.2s ease-out;
    }
    .chevron-icon {
      transition: transform 0.2s ease;
    }
    .chevron-open {
      transform: rotate(90deg);
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-panel flex flex-col border-r border-theme shrink-0 z-20">
    <div class="p-5 border-b border-theme flex flex-col items-center gap-2.5 text-center">
      <div class="w-20 h-20 rounded-full flex items-center justify-center overflow-hidden border-2 border-emerald-500/40 bg-card p-1.5 shadow-inner">
        <img src="logo.png" alt="CBMPE" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100/1e232d/10b981?text=CBMPE'">
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight">Estudei CBMPE</h1>
        <p class="text-xs text-sec">2º Tenente (Instituto AOCP)</p>
      </div>
    </div>
    <nav class="flex-1 p-3.5 space-y-1.5 overflow-y-auto">
      <button onclick="navigate('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg hover-bg transition text-left text-brand bg-emerald-500/10 font-semibold text-sm">
        <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
      </button>
      <button onclick="navigate('estrategia')" id="nav-estrategia" class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg hover-bg transition text-left text-sec font-medium text-sm relative overflow-hidden group">
        <i class="fa-solid fa-brain w-5 text-center text-purple-400"></i> <span>Centro de Comando</span>
      </button>
      <button onclick="navigate('edital')" id="nav-edital" class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg hover-bg transition text-left text-sec font-medium text-sm">
        <i class="fa-solid fa-sitemap w-5 text-center text-blue-400"></i> <span>Edital Verticalizado</span>
      </button>
      <button onclick="navigate('revisoes')" id="nav-revisoes" class="w-full flex items-center gap-3 py-2.5 px-3.5 rounded-lg hover-bg transition text-left text-sec font-medium text-sm">
        <i class="fa-solid fa-calendar-check w-5 text-center text-amber-400"></i> <span>Mural de Revisões</span>
      </button>
    </nav>
    <div class="p-3.5 border-t border-theme space-y-2">
      <button onclick="abrirModalBackup()" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-card hover-bg border border-theme text-xs font-semibold text-sec transition">
        <i class="fa-solid fa-shield-halved text-brand"></i> Backup & Segurança
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto relative" id="main-content">
    
    <!-- Header Fixo -->
    <header class="sticky top-0 bg-main/90 backdrop-blur-md z-20 px-6 py-4 flex flex-wrap justify-between items-center gap-4 border-b border-theme">
      <div>
        <h2 class="text-xl md:text-2xl font-bold">Olá, Amanda Steffany Quirino</h2>
        <p class="text-sec text-xs md:text-sm">Continue, seu melhor dia para retornar é agora!</p>
      </div>
      <div class="flex items-center gap-2.5">
        <!-- Botão Tema Claro/Escuro -->
        <button onclick="toggleTheme()" id="btn-theme" title="Alternar Tema Claro/Escuro" class="w-10 h-10 rounded-lg bg-panel border border-theme hover-bg flex items-center justify-center text-amber-400 transition shadow-sm">
          <i class="fa-solid fa-sun text-lg" id="icon-theme"></i>
        </button>
        <!-- Botão Backup Rápido -->
        <button onclick="abrirModalBackup()" title="Backup de Segurança" class="h-10 px-3.5 rounded-lg bg-panel border border-theme hover-bg flex items-center gap-2 text-xs font-semibold text-sec transition shadow-sm">
          <i class="fa-solid fa-cloud-arrow-down text-blue-400"></i> <span class="hidden sm:inline">Backup</span>
        </button>
        <!-- Botão Adicionar Estudo -->
        <button onclick="openModalEstudo('estudo')" class="h-10 bg-brand hover:opacity-90 text-white font-bold px-5 rounded-lg transition shadow-md flex items-center gap-2 text-sm">
          <i class="fa-solid fa-plus"></i> Adicionar Estudo
        </button>
      </div>
    </header>

    <div class="p-6 md:p-8">
      
      <!-- ================= TELA 1: DASHBOARD ================= -->
      <div id="view-dashboard" class="block max-w-6xl mx-auto space-y-6">
        
        <!-- Cards Superiores -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-panel p-5 rounded-xl border border-theme shadow-sm">
            <p class="text-sec text-xs font-bold uppercase tracking-wider mb-1">Tempo Total de Estudo</p>
            <p class="text-3xl font-bold text-main" id="stat-tempo">0h 0m</
